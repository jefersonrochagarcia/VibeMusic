  <title>Vibemusic — O Pulso da Música Contemporânea</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-dark: #0b0914;
      --bg-card: #141126;
      --bg-card-hover: #1c1836;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-neon: #a855f7;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'Outfit', sans-serif;
    }

    [data-theme="light"] {
      --bg-dark: #f8fafc;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: rgba(0, 0, 0, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .brand-text {
      font-family: var(--font-heading);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(11, 9, 20, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
    }

    .header-container {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-main);
      font-size: 1.5rem;
      font-weight: 800;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 30px;
      width: 320px;
    }

    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      margin-left: 0.5rem;
      width: 100%;
      font-size: 0.9rem;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-icon {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.6rem;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 1280px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 2.5rem;
    }

    .filter-tags {
      display: flex;
      gap: 0.75rem;
      overflow-x: auto;
      padding-bottom: 1rem;
      margin-bottom: 2rem;
      scrollbar-width: none;
    }

    .filter-tag {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-tag.active {
      background: var(--accent-purple);
      color: white;
      border-color: var(--accent-purple);
    }

    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .post-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .post-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-purple);
      transition: all 0.3s ease;
    }

    .post-thumb {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .post-content {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .post-category {
      color: var(--accent-cyan);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .post-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      line-height: 1.4;
    }

    .post-excerpt {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-bottom: 1rem;
      flex-grow: 1;
    }

    .post-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .sidebar-widget {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .widget-title {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent-purple);
    }

    .audio-player {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .track-cover {
      width: 100%;
      height: 160px;
      border-radius: 12px;
      object-fit: cover;
      margin-bottom: 1rem;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    .play-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent-purple);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 720px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 20px;
      padding: 2rem;
      position: relative;
    }

    .article-header-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 12px;
      margin: 1rem 0 1.5rem 0;
    }

    .article-body-text {
      font-size: 1.05rem;
      line-height: 1.8;
      color: var(--text-main);
      margin-bottom: 2rem;
      white-space: pre-line;
    }

    .close-modal-icon {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
      .search-bar {
        display: none;
      }
    }
  </style>
</head>

    let posts = [...initialPosts];
    let currentCategory = 'todos';

    function renderPosts(items) {
      const grid = document.getElementById('postsGrid');
      grid.innerHTML = '';

      if (items.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); margin: 3rem 0;">Nenhum artigo encontrado.</p>`;
        return;
      }

      items.forEach(post => {
        const card = document.createElement('article');
        card.className = 'post-card';
        card.onclick = () => openArticle(post.id);
        card.innerHTML = `
          <img src="${post.image}" alt="${post.title}" class="post-thumb">
          <div class="post-content">
            <span class="post-category">${post.category}</span>
            <h3 class="post-title">${post.title}</h3>
            <p class="post-excerpt">${post.excerpt}</p>
            <div class="post-footer">
              <span>${post.date}</span>
              <span><i data-lucide="heart" style="width: 14px; height: 14px; display: inline;"></i> ${post.likes}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
      lucide.createIcons();
    }

    window.openArticle = function(id) {
      const post = posts.find(p => p.id === id);
      if (!post) return;

      const fullView = document.getElementById('articleFullView');
      fullView.innerHTML = `
        <span class="post-category">${post.category}</span>
        <h1 style="font-size: 1.8rem; margin: 0.5rem 0 0.75rem 0; line-height: 1.3;">${post.title}</h1>
        <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; display: flex; gap: 1rem;">
          <span>Por: <strong>${post.author || 'Redação'}</strong></span>
          <span>•</span>
          <span>${post.date}</span>
        </div>
        <img src="${post.image}" alt="${post.title}" class="article-header-img">
        <div class="article-body-text">${post.content}</div>
        
        <div style="border-top: 1px solid var(--border-color); padding-top: 1.5rem; margin-top: 2rem;">
          <h4 style="margin-bottom: 1rem;">Comentários</h4>
          <p style="font-size: 0.88rem; color: var(--text-muted);">Seja o primeiro a comentar nesta matéria!</p>
        </div>
      `;

      document.getElementById('articleModalOverlay').style.display = 'flex';
      lucide.createIcons();
    };

    window.closeArticleModal = function() {
      document.getElementById('articleModalOverlay').style.display = 'none';
    };

    document.getElementById('filterContainer').addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-tag')) {
        document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.dataset.category;
        filterPosts();
      }
    });

    document.getElementById('searchInput').addEventListener('input', filterPosts);

    function filterPosts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = posts.filter(post => {
        const matchesCategory = currentCategory === 'todos' || post.category === currentCategory;
        const matchesSearch = post.title.toLowerCase().includes(query) || post.excerpt.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });
      renderPosts(filtered);
    }

    let isDark = true;
    document.getElementById('themeToggle').onclick = () => {
      isDark = !isDark;
      document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
    };

    renderPosts(posts);
    lucide.createIcons();
  </script>
</body>
